---
name: "WebTransportBrowser"

on:
  push:
    branches:
      - master
      - webtransport_refresh
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome WebTransport smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | \
              sudo gpg --dearmor -o /usr/share/keyrings/google-linux.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | \
              sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Build pico_baton
        run: |
          cmake -S . -B build -DPICOQUIC_FETCH_PTLS:BOOL=ON
          cmake --build build -j$(nproc) --target pico_baton

      - name: Run Chrome WebTransport baton smoke
        env:
          CHROME_BIN: google-chrome
          PICOQUIC_WT_CHROME_HEADLESS: old
        run: |
          npx -y node@22 tests/webtransport/browser/run-chrome.mjs

  safari:
    name: Safari WebTransport smoke
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          brew install openssl

      - name: Enable Safari WebDriver
        run: |
          sudo safaridriver --enable

      - name: Build pico_baton
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig"
          cmake -S . -B build -DPICOQUIC_FETCH_PTLS:BOOL=ON
          cmake --build build -j$(sysctl -n hw.ncpu) --target pico_baton

      - name: Run Safari WebTransport baton smoke
        env:
          PICOQUIC_WT_SERVER_LOG: "1"
          # Safari 26.4 on the macos-26 GitHub image rejects the first BYOB
          # read from an incoming WebTransport stream with NetworkError after
          # ready has resolved. Keep the smoke on the default reader path; BYOB
          # coverage belongs in a separate browser expected-results matrix.
          PICOQUIC_WT_USE_BYOB: "0"
          # The same Safari 26.4 CI image also fails before delivering the
          # first heavily padded server-initiated WT stream. Use compact baton
          # packets for this smoke; native and Chrome jobs keep padded coverage.
          # Pin the endpoint to IPv4 loopback because Safari 26.4 CI has also
          # been observed opening competing IPv4/IPv6 QUIC attempts for
          # localhost before reporting WebTransportError.
          PICOQUIC_WT_URL: "https://127.0.0.1:4433/baton?version=0&baton=251&count=1&padding=0"
        run: |
          npx -y node@22 tests/webtransport/browser/run-safari.mjs
