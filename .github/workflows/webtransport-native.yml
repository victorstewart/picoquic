---
name: "WebTransportNative"

on:
  push:
    branches:
      - master
      - webtransport_refresh
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wire-strict:
    name: Native WebTransport wire/strict
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build picohttp_ct
        run: |
          cmake -S . -B build -DPICOQUIC_FETCH_PTLS:BOOL=ON
          cmake --build build -j$(nproc) --target picohttp_ct

      - name: Run direct SETTINGS error regression
        run: |
          ./build/picohttp_ct -S . -n -r h3zero_setting_error

      - name: Run WebTransport native wire/strict/fuzz tests
        run: |
          ctest --test-dir build -L 'wt_wire|wt_strict|wt_fuzz' --output-on-failure -j$(nproc)

      - name: Upload native WebTransport failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webtransport-native-failure-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/**/*.log
            build/**/*.qlog
            *.qlog

  native-wire-strict-sanitizers:
    name: Native WebTransport wire/strict ASAN/UBSAN
    runs-on: ubuntu-latest

    env:
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Build sanitizer picohttp_ct
        run: |
          cmake -S . -B build-sanitize \
            -DPICOQUIC_FETCH_PTLS:BOOL=ON \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-sanitize -j$(nproc) --target picohttp_ct

      - name: Run sanitizer SETTINGS error regression
        run: |
          ./build-sanitize/picohttp_ct -S . -n -r h3zero_setting_error

      - name: Run sanitizer WebTransport native wire/strict/fuzz tests
        run: |
          ctest --test-dir build-sanitize -L 'wt_wire|wt_strict|wt_fuzz' --output-on-failure -j$(nproc)

      - name: Upload sanitizer WebTransport failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webtransport-native-failure-${{ github.run_id }}-${{ github.job }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-sanitize/Testing/Temporary/LastTest.log
            build-sanitize/Testing/Temporary/LastTestsFailed.log
            build-sanitize/**/*.log
            build-sanitize/**/*.qlog
            *.qlog
